name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.runner_arch }})
    runs-on: [self-hosted, Linux, "${{ matrix.runner_arch }}"]
    strategy:
      fail-fast: false
      matrix:
        runner_arch: [X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check OCI source labels
        shell: bash
        run: |
          # GHCR links a package to its repo via org.opencontainers.image.source;
          # every Containerfile/Dockerfile (incl. templates) must carry it.
          want="org.opencontainers.image.source=\"https://github.com/${GITHUB_REPOSITORY}\""
          status=0
          while IFS= read -r f; do
            grep -qF "$want" "$f" || { echo "::error file=$f::missing $want"; status=1; }
          done < <(git ls-files | grep -iE '(^|/)(containerfile|dockerfile)[^/]*$|\.(containerfile|dockerfile)(\.j2)?$' | grep -viE '\.(md|py|sh|txt|ya?ml|json)$')
          exit "$status"

      - name: Select Python provisioning
        id: python-provision
        run: |
          source /etc/os-release
          if [ "$(uname -m)" = "x86_64" ] && [ "$ID" = "ubuntu" ] && [ "$VERSION_ID" = "25.04" ]; then
            echo "mode=system" >> "$GITHUB_OUTPUT"
          else
            echo "mode=setup-python" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.python-provision.outputs.mode == 'setup-python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Select Python binary
        run: |
          if [ "${{ steps.python-provision.outputs.mode }}" = "system" ]; then
            SOURCE_PYTHON=python3
          else
            SOURCE_PYTHON=python
          fi
          "$SOURCE_PYTHON" -c 'import sys; sys.exit(f"Python 3.13 required, found {sys.version}") if sys.version_info[:2] != (3, 13) else print(sys.version)'
          VENV_DIR="$RUNNER_TEMP/billing-venv"
          "$SOURCE_PYTHON" -m venv --clear "$VENV_DIR"
          echo "PYTHON_BIN=$VENV_DIR/bin/python" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          "$PYTHON_BIN" -m pip install --upgrade pip
          "$PYTHON_BIN" -m pip install -e .[dev]

      - name: Run tests
        run: |
          "$PYTHON_BIN" -m pytest -q

  container:
    name: Multi-architecture container
    needs: python
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up rootless Docker
        uses: docker/setup-docker-action@v5
        with:
          set-host: true
          rootless: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish tested image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/neuralmimicry/billing:latest
            ghcr.io/neuralmimicry/billing:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/neuralmimicry/billing
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/neuralmimicry/billing
            index:org.opencontainers.image.description=Token accounting, payment capture, and auditable ledger service for the NeuralMimicry platform
          cache-from: type=gha
          cache-to: type=gha,mode=max
